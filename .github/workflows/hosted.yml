name: Hosted backend and frontend checks
on:
  push:
    paths: ["backend/**", "frontend/**", ".github/workflows/hosted.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/hosted.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: claimwise_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_DB: claimwise_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimwise_test -d claimwise_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://claimwise_test:synthetic_test_password@127.0.0.1:5432/claimwise_test
      NEATLOGS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: "3.12"
      - run: uv sync --project backend --locked --extra test --python 3.12
      - run: backend/.venv/bin/python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
        env:
          VERCEL: "1"
          VITE_API_BASE: https://synthetic-backend.vercel.app
