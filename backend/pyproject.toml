[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-evidence-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "python-multipart>=0.0.20,<1",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3.0,<4",
  "redis>=5,<7", "rq>=2,<3", "httpx>=0.28,<1",
  "keyring>=25,<26", "pymupdf>=1.25,<2", "pytesseract>=0.3.13,<1",
  "pillow>=11,<13", "PyJWT[crypto]>=2.10,<3", "filelock>=3.16,<4"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
